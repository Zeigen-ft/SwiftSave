name: Build SwiftSave APK

on:
  workflow_dispatch:
  push:
    branches: ['main', 'master']
  pull_request:

permissions:
  contents: read

jobs:
  x-metadata-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the current stable extraction engine
        run: python -m pip install 'yt-dlp==2026.10.26'
      - name: Verify X first-video selection without network
        run: python tests/x_playlist_regression.py
      - name: Check X access using metadata only
        if: contains(github.event.head_commit.message, '[x probe]')
        env:
          X_PROBE_URL: https://x.com/i/web/status/2116122944376275285
        run: python tools/probe_x_metadata.py
      - uses: actions/upload-artifact@v4
        if: contains(github.event.head_commit.message, '[x probe]')
        with:
          name: SwiftSave-X-metadata-results
          path: x-metadata-results.json
          if-no-files-found: error
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run policy regression tests
        run: bash tests/run.sh
      - name: Build installable debug APKs
        shell: bash
        run: |
          set -o pipefail
          bash ./gradlew --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee build.log
      - name: Verify APK signatures and bundled download engine
        shell: bash
        run: |
          for apk in app/build/outputs/apk/debug/*.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          done
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          for abi in ('arm64-v8a', 'armeabi-v7a'):
              apk = Path(f'app/build/outputs/apk/debug/app-{abi}-debug.apk')
              with ZipFile(apk) as archive:
                  names = set(archive.namelist())
                  for binary in ('libpython.so', 'libpython.zip.so', 'libffmpeg.so', 'libffmpeg.zip.so', 'libqjs.so'):
                      assert f'lib/{abi}/{binary}' in names, f'{apk.name}: missing {binary}'
                  assert 'classes.dex' in names
              print(f'{apk.name}: signed APK with Python, FFmpeg, and QuickJS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: SwiftSave-arm64-APK
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: SwiftSave-armv7-APK
          path: app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: SwiftSave-universal-APK
          path: app/build/outputs/apk/debug/app-universal-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: SwiftSave-build-reports
          path: |
            build.log
            **/build/reports/
          if-no-files-found: ignore
