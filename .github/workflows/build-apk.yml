name: Build SwiftSave APK

on:
  workflow_dispatch:
  push:
    branches: ['main', 'master']
  pull_request:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run policy regression tests
        run: bash tests/run.sh
      - name: Build installable debug APKs
        shell: bash
        run: |
          set -o pipefail
          bash ./gradlew --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee build.log
      - uses: actions/upload-artifact@v4
        with:
          name: SwiftSave-debug-APKs
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: SwiftSave-build-reports
          path: |
            build.log
            **/build/reports/
          if-no-files-found: ignore
